<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Seat Selector</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <style>
    /* Global reset and box-sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;  
      font-family: "Huninn", sans-serif;
      font-weight: 400;
      font-style: normal;

    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      position: relative;
    }

    select {
      margin: 20px;
      padding: 5px;
      width: 200px;
      text-align: center;
      font-size: 18px;
      font-family: "Huninn", sans-serif;
      font-weight: 400;
      background-color: #ececec;
      border-radius: 5px;
      border: 0;
    }

    .botao-confirma {
      padding: 5px 10px;
      font-size: 18px;
      background-color: #4CAF50;
      border-radius: 5px;
      border: 0;
    }

    /* Background Image */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('Assets/krists-luhaers-AtPWnYNDJnM-unsplash.jpg');
      /*background-size:contain;*/
      background-repeat: repeat-y;
      background-position: center;
      filter: blur(8px); /* Blurred effect */
      z-index: -1; /* Ensures it stays behind the content */
    }

    /* Container styling */
    .container {
      /*max-width: 800px;*/
      width: fit-content;
      height: fit-content;
      margin: 50px auto;
      background-color: rgba(0, 0, 0, 0.9); /* Darker transparency for background visibility */
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #f39c12;
      margin-bottom: 20px;
    }

    .screen {
      background-color: #fff;
      height: 50px;
      width: 100%;
      text-align: center;
      line-height: 50px;
      font-size: 24px;
      font-weight: 500; /* Changed to medium font weight */
      color: #000;
      margin: 20px 0;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .background-movies {
        background-color: #fff;
        text-align: center;
        width: fit-content;
        height: fit-content;
        /*line-height: 50px;*/
        font-size: 24px;
        font-weight: 600; /* Changed to medium font weight */
        color: #000;
        margin: 20px 0;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .seat-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .row {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .seat {
      background-color: #4CAF50;
      height: 40px;
      width: 40px;
      margin: 5px;
      text-align: center;
      line-height: 40px;
      cursor: pointer;
      border-radius: 5px;
    }

    .seat.selected {
      background-color: #f39c12;
    }

    .seat.unavailable {
      background-color: #e74c3c;
      cursor: not-allowed;
    }

    .seat:hover:not(.unavailable):not(.selected) {
      background-color: #666;
    }

    /* Legend */
    .legend {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
    }

    .legend-item div {
      height: 20px;
      width: 20px;
      margin-right: 10px;
    }

    .static-available {
      background-color: #4CAF50;
    }

    .static-selected {
      background-color: #f39c12;
    }

    .static-unavailable {
      background-color: #e74c3c;
    }

    .summary {
      margin-top: 20px;
      font-size: 18px;
    }

    .btn {
      padding: 10px 20px;
      background-color: #ffcc00;
      border: none;
      color: #000;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 auto;
      display: block;
    }

    .btn:hover {
      background-color: #e6b800;
    }

    /* Footer styling */
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.8); /* Transparency for footer */
      color: #fff;
      position: fixed;
      bottom: 0;
    }

    .footer .legal, .footer .designed-by {
      font-size: 12px;
    }

    .footer .designed-by {
      text-align: right;
    }
  </style>
</head>
<body style="margin: 30px; height: fit-content;">

  <!-- Background Image -->
<div class="background"></div>

  <!-- Main Content Container -->
<div class="container">
    <h1>Cineplex Movies</h1>

    <!-- Screen Section -->
    <div class="background-movies" style="padding-left: 20px;">
        <div class="column"> <!--lista filmes -->
            <div class="row">
                <form id="escolheSala" action="" style="padding-right: 30px;">
                  <label for="salas">Selecione a sala que deseja alterar:</label>
                  <br>
                  <Select name="salas" id="salas">
                    <option value="1">Sala 1</option>
                    <option value="2">Sala 2</option>
                    <option value="3">Sala 3</option>
                  </Select>
                  <button class="botao-confirma" type="submit">Confirma</button>
                </form>
            </div>
            <div class="row">
              <div id="resultado">

              </div>
            </div>
            <div class="row">
                <div class="summary" style="margin-bottom: 30px;">
                    <button class="btn" type="">
                      <a href="teste_salas.html" style="text-decoration: none; color: #000;">
                        Voltar
                      </a>
                    </button>
                </div>
            </div>
            <div class="row">
              <div id="alteraAssentos">

              </div>
            </div>
        </div>
    </div>
</div>



  <!-- Footer Section -->
<div class="footer">
    <div class="legal">
      <p>&copy; 2024 Cineplex Movies. All rights reserved.</p>
    </div>
    <div class="designed-by">
      <p>Designed by Chatura Dissanayake | consultchatura@gmail.com</p>
    </div>
</div>

    <script src="scriptSeats.js"></script>
</body>
</html>
